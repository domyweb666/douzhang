<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="豆帳">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>豆帳</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --tint:#34C759; --tint-d:#2DA94C; --red:#FF3B30;
  --pod:#BFE0A3; --pod-d:#9CC77E;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000; --card:#1C1C1E; --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --tint:#30D158; --tint-d:#28B44A; --red:#FF453A; --pod:#7FA86A; --pod-d:#5F8A4C;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;font-size:17px;letter-spacing:-.01em}
body{display:flex;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;max-width:430px;height:100%;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
textarea,input,select{font:inherit;color:var(--label)}

/* 三頁：其他功能｜主畫面｜設定 */
#pager{position:absolute;inset:0;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none}
#track{display:flex;width:300%;height:100%;transform:translateX(-33.3333%);will-change:transform}
.page{flex:0 0 33.3333%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 44px) 16px calc(env(safe-area-inset-bottom) + 30px)}
.page input,.page textarea,.page select{-webkit-user-select:text;user-select:text}
#p-home{overflow:hidden;display:flex;flex-direction:column;padding-bottom:0}
.dots{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);display:flex;z-index:8;transition:opacity .3s}
.dots button{width:24px;height:28px;display:grid;place-items:center}
.dots i{display:block;width:7px;height:7px;border-radius:4px;background:var(--label3);transition:all .25s}
.dots button.on i{width:18px;background:var(--label2)}
#app.busy .dots{opacity:0;pointer-events:none}

h1{font-size:34px;font-weight:700;margin:6px 4px 2px;line-height:1.15}
.sub{font-size:17px;color:var(--label2);margin:0 4px 18px;line-height:1.45}
.sec{font-size:22px;font-weight:700;margin:22px 4px 10px}
.cap{font-size:13px;color:var(--label2);margin:22px 16px 8px}
.foot-note{font-size:13px;color:var(--label2);margin:8px 16px 0;line-height:1.45}
.group{background:var(--card);border-radius:26px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 18px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:18px;right:0;height:.5px;background:var(--sep)}
.row .t{flex:1}
.row .v{color:var(--label2)}
.row .s{display:block;font-size:13px;color:var(--label2);margin-top:2px}
.row .chev{color:var(--label3);font-size:20px;line-height:1}
button.row:active{background:var(--fill)}
.row.tint .t{color:var(--tint);font-weight:600}
.row.danger .t{color:var(--red)}
.ill{display:block;margin:0 auto;height:auto}

/* 主畫面 */
.home-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding-top:4px}
.card{width:100%;background:var(--card);border-radius:26px;padding:18px 20px 20px;position:relative;text-align:left;min-height:118px;transition:transform .15s}
.card.tap:active{transform:scale(.985)}
.card .k{font-size:13px;color:var(--label2);font-weight:600;letter-spacing:.02em}
.card .txt{font-size:22px;line-height:1.45;font-weight:500;margin-top:6px;word-break:break-word;padding-right:58px}
.card .deco{position:absolute;right:10px;top:8px;width:60px;height:auto;transform-origin:50% 100%}
.card .over{font-size:15px;color:var(--label2);margin-top:10px;line-height:1.5}
.card.rest{display:flex;align-items:center;gap:14px}
.card.rest .txt{font-size:18px;padding-right:0}
.rest-pic{height:96px;width:auto;flex:none}
.first-in{width:100%;min-height:96px;border:0;outline:none;resize:none;background:transparent;font-size:21px;line-height:1.45;padding:0}
.first-in::placeholder{color:var(--label3)}
.clock{font-family:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;font-size:92px;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1;margin-top:26px}
.line{min-height:44px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--label2);text-align:center;padding:0 8px}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:4px;color:var(--label)}
.chip:active{background:var(--fill2)}
.chip .chev{color:var(--label3)}
.cta{display:inline-flex;align-items:center;justify-content:center;height:62px;min-width:200px;padding:0 34px;border-radius:999px;
  background:var(--tint);color:#fff;font-size:19px;font-weight:700;box-shadow:0 8px 24px rgba(52,199,89,.32);margin-top:18px;transition:transform .1s}
.cta:active{transform:scale(.97);background:var(--tint-d)}
.cta.ghost{background:var(--card);color:var(--label);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.cta.wide{width:100%}
.hint{min-height:22px;margin-top:12px;font-size:14px;color:var(--label2);text-align:center}
.hint .link{color:var(--tint);font-weight:600;font-size:14px}
.err{font-size:13px;color:var(--red);min-height:18px;margin-top:4px}

/* 重力豆罐 */
#jar{position:relative;flex:0 0 auto;height:min(200px,25vh);margin:0 -16px calc(env(safe-area-inset-bottom) + 12px)}
#jar .pz{position:absolute;left:0;top:0;width:36px;height:36px;background:url(img/pea.webp) center/contain no-repeat;will-change:transform;pointer-events:none;z-index:3}
#jar .pz.x2{width:68px;background-image:url(img/pea2.webp)}
.jar-hint{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:13px;color:var(--label3);pointer-events:none}

/* 鈴響：寫字放最顯眼 */
.overlay{position:absolute;inset:0;background:var(--bg);z-index:12;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 20px);overflow-y:auto}
.overlay.on{display:flex;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.bell-top{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.bell-top img{height:84px;width:auto}
.bell-top h2{font-size:28px;font-weight:700;margin:0 0 4px}
.bell-top p{margin:0;color:var(--label2);font-size:15px}
.big-in{width:100%;min-height:150px;border:0;outline:none;resize:none;background:var(--card);border-radius:26px;padding:18px 20px;font-size:22px;line-height:1.5}
.big-in::placeholder{color:var(--label3)}
.big-in:focus{box-shadow:0 0 0 2px var(--tint)}
.links{display:flex;justify-content:center;gap:6px;margin-top:14px;font-size:15px;color:var(--label3)}
.links button{color:var(--label2);padding:6px 4px}
.notes{list-style:none;margin:16px 0 0;padding:0}
.notes li{font-size:15px;color:var(--label2);padding:10px 4px;border-top:.5px solid var(--sep)}

/* 底部彈出卡 */
#veil{position:absolute;inset:0;background:rgba(0,0,0,.25);display:none;z-index:30;align-items:flex-end}
#veil.on{display:flex}
.sheet{width:100%;background:var(--bg);border-radius:34px 34px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88%;overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 12px}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:22px;font-weight:700;margin:4px 4px 4px}
.sheet .sub{margin-bottom:14px;font-size:15px}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:2px;gap:2px;margin:6px 0 14px}
.seg button{flex:1;height:36px;border-radius:10px;font-size:15px}
.seg button.pick{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.field{width:100%;height:52px;padding:0 18px;border:0;background:var(--card);border-radius:16px;font-size:17px;outline:none}
.two{display:flex;gap:10px;margin-top:14px}
.two>*{flex:1}
.btn2{display:flex;align-items:center;justify-content:center;height:52px;border-radius:999px;background:var(--fill);font-size:17px;font-weight:600;width:100%}
.btn2:active{background:var(--fill2)}
.sheet .cta{margin-top:0;height:52px;min-width:0;font-size:17px;box-shadow:none}
.receipt .row{min-height:48px;align-items:flex-start}
.receipt .tm{width:46px;flex:none;color:var(--label2);font-variant-numeric:tabular-nums;font-size:15px;padding-top:1px}
.receipt .tx{flex:1;font-size:16px;line-height:1.45;word-break:break-word}
.muted{color:var(--label3)}

/* 豆莢列 */
.pod{display:inline-flex;align-items:center;gap:2px;padding:5px 9px;border-radius:999px;background:var(--pod);box-shadow:inset 0 -2px 0 var(--pod-d),inset 0 2px 0 rgba(255,255,255,.35);min-height:30px;flex-wrap:wrap;max-width:100%}
.p{width:18px;height:18px;background:url(img/pea.webp) center/contain no-repeat;flex:none}
.p.x2{width:33px;background-image:url(img/pea2.webp)}
.p.void{background:none;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.14)}
.leaf{display:inline-block;width:26px;height:16px;border-radius:0 100% 0 100%;background:var(--pod);box-shadow:inset -2px -2px 0 var(--pod-d)}
.day-row .d{width:92px;flex:none}
.day-row .d b{display:block;font-weight:600}
.day-row .d span{font-size:13px;color:var(--label2)}

.sw{position:relative;width:51px;height:31px;border-radius:999px;background:var(--fill2);transition:background .2s;flex:none}
.sw.on{background:var(--tint)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.sw.on::after{transform:translateX(20px)}
.sel{border:0;background:transparent;color:var(--label2);font-size:17px;text-align:right;text-align-last:right;outline:none;-webkit-appearance:none;appearance:none}
.name-in{flex:1;border:0;background:transparent;font-size:17px;outline:none;min-width:0}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 40px);transform:translateX(-50%);background:var(--card);
  box-shadow:0 6px 24px rgba(0,0,0,.12);padding:11px 18px;border-radius:999px;font-size:15px;z-index:40;opacity:0;transition:opacity .3s;
  pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.grow-in{animation:growIn .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes growIn{0%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="pager"><div id="track">

    <!-- 往右滑：豆棚 -->
    <section class="page" id="p-rack">
      <h1>豆棚</h1><p class="sub" id="rackSub"></p>
      <div id="rackBody"></div>
    </section>

    <!-- 主畫面 -->
    <section class="page" id="p-home">
      <div class="home-main">
        <div class="card" id="card"></div>
        <div class="clock" id="clock">25:00</div>
        <div class="line" id="line"></div>
        <button class="cta" id="mainBtn">開始</button>
        <div class="hint" id="hint"></div>
      </div>
      <div id="jar"><div class="jar-hint" id="jarHint"></div></div>
    </section>

    <!-- 往左滑：設定 -->
    <section class="page" id="p-set">
      <h1>設定</h1><p class="sub"></p>
      <div id="setBody"></div>
    </section>

  </div></div>

  <div class="dots" id="dots"><button aria-label="豆棚"><i></i></button><button aria-label="主畫面"><i></i></button><button aria-label="設定"><i></i></button></div>

  <section class="overlay" id="s-bell">
    <div class="bell-top"><img src="img/face-think.webp" alt=""><div><h2>響了。</h2><p>寫一行給下一顆的自己。</p></div></div>
    <textarea class="big-in" id="clueIn" maxlength="120" placeholder="做到哪／從哪接／還卡著什麼"></textarea>
    <div class="err" id="clueErr"></div>
    <button class="cta wide" id="bKeep" style="margin-top:8px">收下這顆</button>
    <div class="links"><button id="bSkip">畫面就是線索</button><span id="flowSep">・</span><button id="bFlow">在狀態裡，再做一下</button></div>
    <ul class="notes" id="bellNotes"></ul>
  </section>

  <div id="veil"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(()=>{
const KEY='douzhang.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const chev='<span class="chev">›</span>';
const LINES=['收下了，這顆是完整的。','豆莢裡多一顆。','響完了，起來喝口水。','那句會在下一顆等你。','寫下來了，腦袋可以先放掉它。',
'好，停在這裡剛剛好。','一顆，沒有半顆。','先離開螢幕五分鐘。','收據開好了。','去窗邊看一下遠的地方。','這一句留給五分鐘後的你。',
'豆莢又長一點了。','站起來伸個懶腰吧。','手機先別拿，走兩步。','剛那段辛苦了。','下一步在這裡了，不用一直記著。','這顆長得挺飽滿。',
'記好了，休息去。','一段沒被打斷的，收進來。','好，喝水時間。','豆子入莢。','先閉眼坐一下也行。','這顆算數。','去倒杯水，鈴響再回來。'];
const VOIDLINES=['記一筆就好，下一顆重新來。','空一格，沒關係。','記下來了，原因寫事實就好。','這顆先放著，等下再開一顆。'];
const RESTPICS=['rest-water','rest-far','rest-stretch','rest-closed'];
const WD=['日','一','二','三','四','五','六'];

/* ---------- 資料 ---------- */
function blank(){return{v:1,settings:{types:[{id:'t1',name:'一般',len:25}],typeId:'t1',restMode:'auto',sound:true,demo:false,closeTime:'19:00',tilt:true},
  current:null,clue:null,days:{},planted:null,lastLine:-1}}
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}if(!S.settings)S=blank();if(S.settings.tilt===undefined)S.settings.tilt=true}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('這台裝置沒辦法存，記得匯出備份')}}
const dkey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function day(k=dkey()){return S.days[k]||(S.days[k]={beans:[],voids:[],tasks:[],closed:false,leaf:false,restOver:0})}
const typeOf=id=>S.settings.types.find(t=>t.id===id)||S.settings.types[0];
const units=len=>Math.max(1,Math.round(len/25));
const unitMs=()=>S.settings.demo?1000:60000;
const restLen=len=>Math.max(3,Math.round(len/5));
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const mmss=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const md=k=>{const d=new Date(k+'T00:00');return `${d.getMonth()+1}月${d.getDate()}日`};

/* ---------- 聲音 ---------- */
let AC;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,dur,vol,type='sine',when=0){if(!S.settings.sound||!AC)return;const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;const t=a.currentTime+when;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
const chime=()=>{tone(784,1.6,.18);tone(1175,1.4,.08,'sine',.02)};
const pop=()=>{tone(180,.18,.25,'triangle');tone(320,.08,.08,'sine',.01)};

/* ---------- 三頁與滑動 ---------- */
let page=1,mode='idle';
const track=$('#track'),pager=$('#pager');
function setPage(i,anim=true){page=Math.max(0,Math.min(2,i));
  track.style.transition=anim&&!reduce?'transform .38s cubic-bezier(.2,.9,.3,1)':'none';
  track.style.transform=`translateX(${-page*33.3333}%)`;
  document.querySelectorAll('#dots button').forEach((b,j)=>b.classList.toggle('on',j===page));
  if(page===0)renderRack();if(page===2)renderSettings();if(page===1)renderHome();
  runWorld(page===1&&!document.hidden)}
document.querySelectorAll('#dots button').forEach((b,j)=>b.onclick=()=>setPage(j));
let drag=null,justDragged=false;
pager.addEventListener('pointerdown',e=>{if(mode!=='idle'||$('#veil').classList.contains('on'))return;
  drag={x:e.clientX,y:e.clientY,t:performance.now(),dx:0,on:false,dead:false,id:e.pointerId}});
pager.addEventListener('pointermove',e=>{if(!drag||drag.dead)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.dx=dx;
  if(!drag.on){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){drag.on=true;track.style.transition='none';try{pager.setPointerCapture(drag.id)}catch(_){}}
    else if(Math.abs(dy)>10)drag.dead=true;return}
  let off=dx;if((page===0&&dx>0)||(page===2&&dx<0))off=dx*.3;
  track.style.transform=`translateX(calc(${-page*33.3333}% + ${off}px))`});
function endDrag(){if(!drag)return;if(drag.on){const w=pager.clientWidth,v=drag.dx/(performance.now()-drag.t);
    if(drag.dx<-w*.2||v<-.45)setPage(page+1);else if(drag.dx>w*.2||v>.45)setPage(page-1);else setPage(page);justDragged=true;setTimeout(()=>justDragged=false,50)}
  drag=null}
pager.addEventListener('pointerup',endDrag);pager.addEventListener('pointercancel',endDrag);
pager.addEventListener('click',e=>{if(justDragged){e.stopPropagation();e.preventDefault()}},true);

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('on'),2400)}

/* ---------- 重力豆罐 ---------- */
const R=18,LINK=32;
const W={bodies:[],links:[],n:0,w:0,h:0,gx:0,gy:1100,tgx:0,tgy:1100,run:false,last:0,day:'',impact:0,lastTick:0};
let tiltOn=false;
const isAndroid=/Android/i.test(navigator.userAgent);
function onMotion(e){const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;const s=isAndroid?-1:1;
  W.tgx=a.x*s*115;W.tgy=-a.y*s*115}
function enableTilt(){if(tiltOn||S.settings.tilt===false)return;
  const go=()=>{window.addEventListener('devicemotion',onMotion);tiltOn=true};
  try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted')go()}).catch(()=>{})}
    else if('DeviceMotionEvent' in window)go()}catch(e){}}
function disableTilt(){window.removeEventListener('devicemotion',onMotion);tiltOn=false;W.tgx=0;W.tgy=1100}
function todayList(){const d=S.days[dkey()];if(!d)return[];return d.beans.slice().sort((a,b)=>a.t-b.t).map(b=>units(b.len)>1)}
function jarSize(){const j=$('#jar');W.w=j.clientWidth;W.h=j.clientHeight}
function addBody(two,x,y,vx=0,vy=0,inJar=true){const el=document.createElement('div');el.className='pz'+(two?' x2':'');$('#jar').appendChild(el);
  if(!two){W.bodies.push({x,y,vx,vy,el,single:true,inJar})}
  else{const a={x:x-LINK/2,y,vx,vy,inJar},b={x:x+LINK/2,y,vx,vy,inJar};a.mate=b;b.mate=a;W.bodies.push(a,b);W.links.push({a,b,el})}
  W.n++}
function rebuild(){$('#jar').querySelectorAll('.pz').forEach(e=>e.remove());W.bodies=[];W.links=[];W.n=0;W.day=dkey();jarSize();
  const list=todayList().slice(-40);
  list.forEach(two=>addBody(two,R+LINK/2+Math.random()*(W.w-2*R-LINK),R+Math.random()*(W.h-2*R)));
  const g=[W.gx,W.gy];W.gx=0;W.gy=1100;for(let i=0;i<360;i++)step(1/60);W.gx=g[0];W.gy=g[1];render()}
function syncWorld(){jarSize();if(W.day!==dkey()||W.n!==Math.min(40,todayList().length))rebuild();
  $('#jarHint').textContent=(!W.n&&S.clue&&mode==='idle')?'第一顆響完，豆子會掉在這裡':''}
function step(dt){const{gx,gy,w,h}=W,B=W.bodies;
  for(const b of B){b.vx+=gx*dt;b.vy+=gy*dt;b.vx*=.996;b.vy*=.996;b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(let it=0;it<4;it++){
    for(const L of W.links){const dx=L.b.x-L.a.x,dy=L.b.y-L.a.y,d=Math.hypot(dx,dy)||1,k=(d-LINK)/d/2;
      L.a.x+=dx*k;L.a.y+=dy*k;L.b.x-=dx*k;L.b.y-=dy*k;const mvx=(L.a.vx+L.b.vx)/2,mvy=(L.a.vy+L.b.vy)/2;
      L.a.vx+= (mvx-L.a.vx)*.3;L.b.vx+=(mvx-L.b.vx)*.3;L.a.vy+=(mvy-L.a.vy)*.3;L.b.vy+=(mvy-L.b.vy)*.3}
    for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){const a=B[i],b=B[j];if(a.mate===b)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,m=2*R;
      if(d2<m*m&&d2>1e-4){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(m-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const jj=-(1.25)*rv/2;a.vx-=jj*nx;a.vy-=jj*ny;b.vx+=jj*nx;b.vy+=jj*ny;if(-rv>W.impact)W.impact=-rv}}}
    for(const b of B){
      if(b.x<R){b.x=R;if(b.vx<0){if(-b.vx>W.impact)W.impact=-b.vx;b.vx=-b.vx*.3}b.vy*=.97}
      if(b.x>w-R){b.x=w-R;if(b.vx>0){if(b.vx>W.impact)W.impact=b.vx;b.vx=-b.vx*.3}b.vy*=.97}
      if(b.y>h-R){b.y=h-R;if(b.vy>0){if(b.vy>W.impact)W.impact=b.vy;b.vy=-b.vy*.3}b.vx*=.97}
      if(b.inJar){if(b.y<R){b.y=R;if(b.vy<0)b.vy=-b.vy*.3}}else if(b.y>R)b.inJar=true}
  }}
function render(){for(const b of W.bodies)if(b.single)b.el.style.transform=`translate(${b.x-R}px,${b.y-R}px)`;
  for(const L of W.links){const cx=(L.a.x+L.b.x)/2,cy=(L.a.y+L.b.y)/2,ang=Math.atan2(L.b.y-L.a.y,L.b.x-L.a.x);
    L.el.style.transform=`translate(${cx-34}px,${cy-R}px) rotate(${ang}rad)`}}
function loop(t){if(!W.run)return;const dt=W.last?Math.min(.033,(t-W.last)/1000):.016;W.last=t;
  W.gx+=(W.tgx-W.gx)*.15;W.gy+=(W.tgy-W.gy)*.15;W.impact=0;step(dt/2);step(dt/2);render();
  if(W.impact>380&&t-W.lastTick>90&&AC){W.lastTick=t;tone(260+Math.random()*90,.05,Math.min(.1,W.impact/5000),'triangle')}
  requestAnimationFrame(loop)}
function runWorld(on){if(on&&!W.run){W.run=true;W.last=0;requestAnimationFrame(loop)}else if(!on)W.run=false}
function dropPea(two){jarSize();const jr=$('#jar').getBoundingClientRect(),cr=$('#card').getBoundingClientRect();
  addBody(two,W.w/2+(Math.random()-.5)*60,cr.top+cr.height/2-jr.top,(Math.random()-.5)*80,-160,false);W.day=dkey();render();pop()}
$('#jar').addEventListener('click',e=>{ac();enableTilt();const r=$('#jar').getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;

    line.innerHTML=`<button class="chip" id="bNote">冒出念頭${c.notes.length?' '+"'".repeat(c.notes.length):''}</button><button class="chip" id="bPing">有人找${c.pings.length?' '+'-'.repeat(c.pings.length):''}</button>`;
    $('#bNote').onclick=()=>quickNote('n');$('#bPing').onclick=()=>quickNote('p');
    btn.textContent='結束';btn.className='cta ghost';btn.onclick=openEnd;
  }else if(mode==='rest'){

function podHTML(d){if(!d)return '<span class="pod"></span>';

function weekStart(k){const d=new Date(k+'T00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return dkey(d.getTime())}
function renderRack(){const keys=Object.keys(S.days).filter(k=>{const d=S.days[k];return d.beans.length||d.voids.length||d.leaf}).sort().reverse();
  const total=keys.reduce((s,k)=>s+S.days[k].beans.length,0),td=S.days[dkey()];
  $('#rackSub').textContent=keys.length?`${keys.length} 莢・${total} 顆`:'還沒有豆莢';
  let h='';
  if(td&&(td.beans.length||td.voids.length)&&!td.closed)h+=`<div class="group" style="margin-bottom:14px"><button class="row tint" id="rClose"><span class="t">收工<span class="s" style="font-weight:400">把今天的豆莢掛上架，留明天的第一句</span></span>${chev}</button></div>`;
  else if(!td||(!td.beans.length&&!td.voids.length&&!td.leaf))h+=`<div class="group" style="margin-bottom:14px"><button class="row" id="rClose"><span class="t">今天不適合番茄？<span class="s">整天在回訊息、開會，掛一片葉子</span></span>${chev}</button></div>`;
  if(!keys.length){h+='<div class="group" style="padding:20px"><img class="ill" src="img/sleep.webp" alt="" style="width:220px"><p class="foot-note" style="text-align:center;margin-top:10px">第一顆響完，這裡就會掛上今天的豆莢。</p></div>'}
  else{h+='<div class="group" style="padding:14px"><img class="ill" src="img/trellis.webp" alt="" style="width:100%;max-width:340px"></div>';
    const weeks={};keys.forEach(k=>(weeks[weekStart(k)]??=[]).push(k));const thisW=weekStart(dkey());
    h+=Object.keys(weeks).sort().reverse().map(ws=>`<div class="sec">${ws===thisW?'這週':md(ws)+' 那週'}</div><div class="group">${weeks[ws].map(k=>{const d=S.days[k],dt=new Date(k+'T00:00');
      return `<button class="row day-row" data-day="${k}"><span class="d"><b>${md(k)}</b><span>星期${WD[dt.getDay()]}</span></span><span style="flex:1">${d.leaf&&!d.beans.length?'<span class="leaf"></span>':podHTML(d)}</span>${chev}</button>`}).join('')}
      <button class="row tint" data-wk="${ws}"><span class="t">翻到背面：這週的收據</span>${chev}</button></div>`).join('')}
  $('#rackBody').innerHTML=h;
  $('#rClose')&&($('#rClose').onclick=openClose);
  $('#rackBody').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>openReceipt(b.dataset.day));
  $('#rackBody').querySelectorAll('[data-wk]').forEach(b=>b.onclick=()=>openWeek(b.dataset.wk))}
function taskRows(d){return d.tasks.map(t=>({t,act:d.beans.filter(b=>b.taskId===t.id).reduce((s,b)=>s+units(b.len),0)}))}
function openReceipt(k){const d=S.days[k];
  const items=[...d.beans.map(b=>({t:b.t,html:`<span class="tm">${hm(b.start||b.t)}</span><span class="tx">${b.clue?esc(b.clue):'<span class="muted">畫面就是線索</span>'}${units(b.len)>1?'<span class="muted">　雙仁</span>':''}${b.flow?`<span class="muted">　延長 ${b.flow} 分</span>`:''}${b.notes.length||b.pings.length?`<br><span class="muted">${"'".repeat(b.notes.length)}${'-'.repeat(b.pings.length)}</span>`:''}</span>`})),
    ...d.voids.map(v=>({t:v.t,html:`<span class="tm">${hm(v.t)}</span><span class="tx muted">作廢，第 ${v.minute} 分鐘${v.reason?'・'+esc(v.reason):''}${v.text?'：'+esc(v.text):''}</span>`}))].sort((a,b)=>a.t-b.t);
  const tr=taskRows(d);
  sheet(`<h3>${md(k)}的收據</h3><p class="sub">${podHTML(d)}</p>
  <div class="group receipt">${items.map(i=>`<div class="row">${i.html}</div>`).join('')||'<div class="row"><span class="tx muted">這天掛的是一片葉子。</span></div>'}</div>
  ${tr.length?`<div class="cap">估算對帳</div><div class="group">${tr.map(({t,act})=>`<div class="row"><span class="t">${esc(t.name)}${t.novel?'<span class="s">第一次做</span>':''}</span><span class="v">估 ${t.est}・實 ${act}</span></div>`).join('')}</div>`:''}
  ${d.restOver?`<p class="foot-note">休息多了 ${d.restOver} 分鐘。</p>`:''}
  <div class="two"><button class="btn2" id="rX">好</button></div>`);$('#rX').onclick=closeSheet}
function openWeek(ws){const ks=Object.keys(S.days).filter(k=>weekStart(k)===ws);
  let under=0,over=0,even=0,flowN=0,beanN=0;const byType={},voids={};
  ks.forEach(k=>{const d=S.days[k];taskRows(d).forEach(({t,act})=>{if(t.novel||!act)return;if(act>t.est)under++;else if(act<t.est)over++;else even++});
    d.beans.forEach(b=>{const n=typeOf(b.typeId).name;byType[n]=(byType[n]||0)+units(b.len);beanN++;if(b.flow)flowN++});
    d.voids.forEach(v=>{const key=typeOf(v.typeId).name+(v.reason?'・'+v.reason:'');voids[key]=(voids[key]||0)+1})});
  const totalV=Object.values(voids).reduce((a,b)=>a+b,0);
  const verdict=under+over+even<3?'對帳的資料還不多，先繼續估。':under>over*2?'這週大多估少了。下次估同類的事，直接多加一些。':over>under*2?'這週大多估多了。':'估少和估多差不多，代表沒有一直往同一邊偏。';
  sheet(`<h3>這週的收據</h3><p class="sub">${md(ws)}起的一週。只看方向，不看分數。</p>
  <div class="group">${Object.entries(byType).map(([n,u])=>`<div class="row"><span class="t">${esc(n)}</span><span class="v">${u} 格</span></div>`).join('')||'<div class="row"><span class="t muted">這週還沒有豆子。</span></div>'}</div>
  <div class="cap">估算對帳</div>
  <div class="group"><div class="row"><span class="t">估少了</span><span class="v">${under} 次</span></div><div class="row"><span class="t">估多了</span><span class="v">${over} 次</span></div><div class="row"><span class="t">剛好</span><span class="v">${even} 次</span></div></div>
  <p class="foot-note">${verdict}</p>
  ${totalV?`<div class="cap">作廢分佈</div><div class="group">${Object.entries(voids).map(([n,c])=>`<div class="row"><span class="t">${esc(n)}</span><span class="v">${c}</span></div>`).join('')}</div>${totalV>=3?'<p class="foot-note">作廢多半跟番茄長度、或任務沒切小有關，不是意志力。</p>':''}`:''}
  ${beanN>=4&&flowN*2>beanN?'<p class="foot-note">這週一半以上的番茄都延長了，這類事可以試試把番茄拉長。</p>':''}
  <div class="two"><button class="btn2" id="wX">好</button></div>`);$('#wX').onclick=closeSheet}

/* ---------- 設定（往左滑） ---------- */
function renderSettings(){const s=S.settings;
  $('#setBody').innerHTML=`<div class="cap" style="margin-top:0">任務類型（每種一個固定長度）</div>
  <div class="group">${s.types.map(t=>`<div class="row"><input class="name-in" data-tn="${t.id}" value="${esc(t.name)}" maxlength="12">
    <select class="sel" data-tl="${t.id}">${[15,20,25,30,45,50,60].map(m=>`<option value="${m}" ${m==t.len?'selected':''}>${m} 分</option>`).join('')}</select>
    ${s.types.length>1?`<button data-td="${t.id}" style="color:var(--red);font-size:15px">刪除</button>`:''}</div>`).join('')}
    <button class="row tint" id="addType"><span class="t">加一種</span></button></div>
  <div class="cap">節奏</div>
  <div class="group">
    <div class="row"><span class="t">休息</span><select class="sel" id="restMode"><option value="auto" ${s.restMode==='auto'?'selected':''}>到點提醒我</option><option value="self" ${s.restMode==='self'?'selected':''}>我自己決定</option></select></div>
    <div class="row"><span class="t">收工時間<span class="s">過了這個時間，主畫面才會出現「收工」</span></span><input type="time" id="closeT" value="${s.closeTime}" class="sel"></div>
  </div>
  <div class="cap">手感</div>
  <div class="group">
    <div class="row"><span class="t">傾斜手機，豆子跟著滾<span class="s">${tiltOn?'已開啟':'iPhone 第一次會問一次權限'}</span></span><button class="sw ${s.tilt!==false?'on':''}" id="swTilt" aria-label="傾斜"></button></div>
    <div class="row"><span class="t">聲音</span><button class="sw ${s.sound?'on':''}" id="swSound" aria-label="聲音"></button></div>
    <div class="row"><span class="t">試玩速度<span class="s">1 分鐘變 1 秒，自用時關掉</span></span><button class="sw ${s.demo?'on':''}" id="swDemo" aria-label="試玩速度"></button></div>
  </div>
  <div class="cap">備份</div>
  <div class="group"><button class="row tint" id="bExp"><span class="t">匯出備份</span></button><button class="row tint" id="bImp"><span class="t">從備份匯入</span></button></div>
  <p class="foot-note">刪掉主畫面捷徑會連資料一起刪，每週匯出一次。</p>
  <input type="file" id="impFile" accept="application/json,.json" hidden>
  <p class="foot-note" style="margin-top:22px">睡不好、生病、情緒低落的時候，任何方法都會看起來沒用。那時該照顧的是自己，不是方法。</p>
  <div class="group" style="margin-top:22px"><button class="row danger" id="bWipe"><span class="t">清空所有資料</span></button></div>`;
  const B=$('#setBody');
  B.querySelectorAll('[data-tn]').forEach(i=>i.onchange=()=>{typeOf(i.dataset.tn).name=i.value.trim()||'未命名';save()});
  B.querySelectorAll('[data-tl]').forEach(i=>i.onchange=()=>{typeOf(i.dataset.tl).len=+i.value;save();toast('這類的對帳從現在重新累積')});
  B.querySelectorAll('[data-td]').forEach(i=>i.onclick=()=>{s.types=s.types.filter(t=>t.id!==i.dataset.td);if(!s.types.find(t=>t.id===s.typeId))s.typeId=s.types[0].id;save();renderSettings()});
  $('#addType').onclick=()=>{s.types.push({id:'t'+Date.now(),name:'新類型',len:25});save();renderSettings()};
  $('#restMode').onchange=e=>{s.restMode=e.target.value;save()};
  $('#closeT').onchange=e=>{s.closeTime=e.target.value;save()};
  $('#swTilt').onclick=()=>{s.tilt=s.tilt===false;save();if(s.tilt)enableTilt();else disableTilt();setTimeout(renderSettings,300)};
  $('#swSound').onclick=()=>{s.sound=!s.sound;save();if(s.sound)ac();renderSettings()};
  $('#swDemo').onclick=()=>{s.demo=!s.demo;save();renderSettings()};
  $('#bExp').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='豆帳備份-'+dkey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  $('#bImp').onclick=()=>$('#impFile').click();
  $('#impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.settings||!o.days)throw 0;if(confirm('用備份覆蓋現在的資料？')){S=o;save();W.day='';toast('匯入好了');renderSettings()}}catch(err){toast('這個檔案讀不懂')}})};
  $('#bWipe').onclick=()=>{if(confirm('清空所有豆子、豆莢和設定？這個沒辦法復原。')){S=blank();save();W.day='';setPage(1)}}}

/* ---------- sheet ---------- */
function sheet(html){$('#sheet').innerHTML='<div class="grabber"></div>'+html;$('#veil').classList.add('on')}
function closeSheet(){$('#veil').classList.remove('on')}
$('#veil').onclick=e=>{if(e.target.id==='veil')closeSheet()};

/* ---------- 開機 ---------- */
load();setPage(1,false);
window.__dz={get S(){return S},setPage,W};
})();
</script>
</body>
</html>
