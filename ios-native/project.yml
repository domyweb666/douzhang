# 番茄帳 iOS（SwiftUI）的專案描述檔。Xcode 專案不進 repo，CI 用 XcodeGen 照這份產生。
# 2026-11-21 多米決定從 Expo 轉 SwiftUI；做法照米說（E:\VoiceType\ios-native）跑通的那套。
# Bundle ID 跟 Expo 版同一個：功能追平後直接接手 TestFlight 上那個 app，資料留在原地。
name: Douzhang

options:
  bundleIdPrefix: org.domyweb
  deploymentTarget:
    iOS: "17.0" # 跟米說一樣：@Observable、彈簧動畫、觸覺回饋都是 iOS 17 的寫法

# 自家的套件（蔬菜家族設定頁共用元件，公開 repo），不連網、沒有別人的程式，不算規矩檔 P4 擋的第三方 SDK
packages:
  VeggieKit:
    url: https://github.com/domyweb666/VeggieKit
    exactVersion: "1.0.1"

# 版本放在最外層：app 與擴充的版本一定要一樣，Apple 才收（封存時指令列蓋 CURRENT_PROJECT_VERSION，兩個一起換）
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Douzhang:
    type: application
    platform: iOS
    sources:
      - Douzhang
      - DouzhangShared
    dependencies:
      - package: VeggieKit
      - target: DouzhangWidgets
    # Info.plist 由 XcodeGen 每次產生（不進 repo）。
    info:
      path: Douzhang/Info.plist
      properties:
        CFBundleDisplayName: 番茄帳
        # 沒宣告語言時 App 用英文的日期格式與系統按鈕字（米說 2026-11-02 踩過）
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations:
          - zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 沒有自己的連線與加密（購買、iCloud 同步都走系統的），出口合規免申報；沒這行每個 build 都要進 App Store Connect 手動回答
        ITSAppUsesNonExemptEncryption: false
        # 平常只有直向；聚焦模式（橫放的整頁時鐘）開著時才轉橫，由 AppDelegate 決定准不准
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        # 鎖定畫面與動態島的倒數（AI27）：要宣告在 app 這邊，不是擴充
        NSSupportsLiveActivities: true
        # 沒這行，iPhone 上 app 自己的動畫最快只到 60Hz（Expo 版有，轉 SwiftUI 時漏了）
        CADisableMinimumFrameDurationOnPhone: true
        # 白噪音：鎖屏、切到別的 app 也繼續播。只有 audio，沒有別的背景模式
        UIBackgroundModes:
          - audio
    # 計時中擋住其他 app（螢幕使用時間 API）。這個檔由 XcodeGen 每次產生，不進 repo
    entitlements:
      path: Douzhang/Douzhang.entitlements
      properties:
        com.apple.developer.family-controls: true
        # 到點通知穿過系統的專注模式；後台 App ID 要先勾 Time Sensitive Notifications，不然封存簽不過
        com.apple.developer.usernotifications.time-sensitive: true
        # iCloud 同步：多米 2026-11-24 在後台建好容器、勾進 App ID 才加。少一個鍵同步就等於沒開
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.domyweb.douzhang
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.org.domyweb.douzhang
        com.apple.developer.icloud-services:
          - CloudDocuments
        # 開發版與正式版看同一份，跟茄記一樣
        com.apple.developer.icloud-container-environment: Production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.douzhang
        # 只給 iPhone（1）。不宣告的話 Apple 用 iPad 多工規格審（ITMS-90023／90474／90475）
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # 鎖定畫面與動態島的倒數（AI27），嵌在 app 裡一起上架。不要權限、不要 App Group，所以沒有 entitlements
  DouzhangWidgets:
    type: app-extension
    platform: iOS
    sources:
      - DouzhangWidgets
      - DouzhangShared
      # 跟 app 同一份的代號、用詞、番茄；只拿畫得出那一張要的
      - Douzhang/Core/AppState.swift
      - Douzhang/Core/Grow.swift
      - Douzhang/Design/DomyTokens.swift
      - Douzhang/Design/Params.swift
      - Douzhang/Design/Tokens.swift
      - Douzhang/Design/TokensLive.swift
      - Douzhang/Design/Words.swift
      - Douzhang/UI/TomatoView.swift
    info:
      path: DouzhangWidgets/Info.plist
      properties:
        CFBundleDisplayName: 番茄帳
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations:
          - zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.douzhang.widgets
        TARGETED_DEVICE_FAMILY: "1"
        # 只跟著 app 走，不單獨裝進封存檔
        SKIP_INSTALL: YES

  DouzhangTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DouzhangTests
        excludes:
          - "*.storekit"
      # StoreKit 的測試商店設定檔（購買測試用，不連 App Store）：當資源帶進測試包
      - path: DouzhangTests/Full.storekit
        buildPhase: resources
    dependencies:
      - target: Douzhang
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.douzhang.DouzhangTests
        # 模擬器版用 ad-hoc 自簽，測試套件也要有 Info.plist 才簽得了；讓 Xcode 自己產
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Douzhang:
    build:
      targets:
        Douzhang: all
        DouzhangTests: [test]
    # 在 Xcode 按執行時用測試商店，不連 App Store、不花錢。只影響開發：打包走 archive，讀不到這個
    run:
      config: Debug
      storeKitConfiguration: DouzhangTests/Full.storekit
    test:
      config: Debug
      targets:
        - DouzhangTests
